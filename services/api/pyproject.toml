[project]
name = "harmaal-api"
version = "0.1.0"
description = "Harmaal property-management API (FastAPI, async SQLAlchemy)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",        # sync driver for Alembic
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "pyotp>=2.9",
    "python-multipart>=0.0.9",
    "alembic>=1.13",
    "reportlab>=4.1",              # tenant invoice / receipt PDF generation
]

[project.optional-dependencies]
dev = [
    # Pinned to a minor range on purpose: `select = ["ALL"]` means every ruff
    # release can enable new rules, and an unpinned floor let CI drift onto a
    # newer ruff than developers had locally — turning the build red on files
    # nobody touched. Bump this deliberately, with the fixes in the same commit.
    "ruff>=0.16,<0.17",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",            # in-memory async DB for tests
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
