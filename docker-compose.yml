version: '3.8'

services:
  # 1. The PostgreSQL Database
  db:
    image: postgres:15
    container_name: harmaal_db
    restart: always
    environment:
      POSTGRES_USER: harmaal_admin
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: harmaal_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. The FastAPI Backend
  backend:
    build: ./backend
    container_name: harmaal_backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app 

volumes:
  postgres_data: